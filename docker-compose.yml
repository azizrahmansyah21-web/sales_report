version: '3.8'

services:
  sales-postgres:
    image: postgres:16-alpine
    container_name: sales-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_report_db}
      POSTGRES_USER: ${POSTGRES_USER:-sales_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PasswordKuatPostgresSales2026!}
    volumes:
      - sales_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sales_user} -d ${POSTGRES_DB:-sales_report_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - app-network

  sales-report-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-report-app
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sales_user}:${POSTGRES_PASSWORD:-PasswordKuatPostgresSales2026!}@sales-postgres:5432/${POSTGRES_DB:-sales_report_db}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://planspk.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-c6b12a0f8e914d7a83b2e59174620f3a9e1d5c7b8a02345e6f1a8c9b0d2e3f4a}
      - AUTH_SECRET=${AUTH_SECRET:-c6b12a0f8e914d7a83b2e59174620f3a9e1d5c7b8a02345e6f1a8c9b0d2e3f4a}
      - AUTH_TRUST_HOST=true
      - ENABLE_WA_NOTIFICATIONS=false
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      sales-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 640M
    networks:
      - app-network

volumes:
  sales_pg_data:
    name: sales_pg_data

networks:
  app-network:
    external: true
